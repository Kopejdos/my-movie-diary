<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Track every movie universe you love – MCU, DC, Star Wars, Studio Ghibli and more.">
    <meta name="theme-color" content="#12161c">
    <title>My Movie Diary</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://image.tmdb.org">

    <script>
        // Uložený režim nastavit dřív, než se stránka vykreslí (jinak by problikla)
        try {
            const theme = localStorage.getItem("mmd-theme");
            if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        } catch { }
    </script>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/app.js"></script>
</head>
<body>
    <header id="site-header" class="header"></header>

    <main id="app" class="main">
        <div class="state"><div class="spinner" aria-hidden="true"></div></div>
    </main>

    <footer class="footer">
        <a href="https://www.themoviedb.org" target="_blank" rel="noopener">
            <img class="footer__tmdb"
                 src="https://www.themoviedb.org/assets/2/v4/logos/v2/blue_short-8e7b30f73a4020692ccca9c88bafe5dcb6f8a62a4c6bc55cd9ba82bb2cd95f6c.svg"
                 alt="TMDB">
        </a>
        <p>This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
        <p>
            <a href="privacy.html">Privacy Policy</a>
            ·
            <a href="https://github.com/Kopejdos/my-movie-diary" target="_blank" rel="noopener">My Movie Diary on GitHub</a>
        </p>
    </footer>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <noscript>My Movie Diary needs JavaScript to run.</noscript>
</body>
</html>
