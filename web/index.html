<!DOCTYPE html>

<head>

    <link rel="icon" type="image/png" href="icons/favicon.png">

    <!-- Písma z projektu: latinka se přednačte hned, ať text neproblikne -->
    <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/chakra-petch-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preconnect" href="https://image.tmdb.org">
    <link rel="preconnect" href="https://vvnexfdnfvwbwluazwoo.supabase.co">

    <script>
        // Uložený režim nastavit dřív, než se stránka vykreslí (jinak by problikla)
        try {
            const theme = localStorage.getItem("mmd-theme");
            if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        } catch { }
    </script>
    <link rel="stylesheet" href="css/style.css">
