<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Track every movie collection you love – MCU, Star Wars, Disney, Pixar, Studio Ghibli and more.">
    <meta name="theme-color" content="#12161c" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f1ebe0" media="(prefers-color-scheme: light)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MMD">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <title>My Movie Diary</title>

    <link rel="icon" type="image/png" href="icons/favicon.png">

    <!-- Písma z projektu: přednačte se jen malé písmo nadpisů. Inter (48 kB) se načte běžně –
         text se do té doby ukáže systémovým písmem (font-display: swap) a nezdržuje start
         aplikace; při další návštěvě je písmo už v mezipaměti (V2.7). -->
    <link rel="preload" href="fonts/chakra-petch-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preconnect" href="https://image.tmdb.org">
    <link rel="preconnect" href="https://vvnexfdnfvwbwluazwoo.supabase.co">

    <script>
        // Uložený režim nastavit dřív, než se stránka vykreslí (jinak by problikla)
        try {
            const theme = localStorage.getItem("mmd-theme");
            if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        } catch { }
    </script>
    <link rel="stylesheet" href="css/style.css">
    <!-- Moduly potřebné hned při startu se stahují najednou (jinak by je prohlížeč objevoval
         postupně). Ostatní obrazovky (admin, hledání, statistiky, profil…) se načtou až při
         prvním otevření – app.js je importuje dynamicky (V2.1.1). -->
    <link rel="modulepreload" href="vendor/supabase-lite-2.119.0.min.js">
    <link rel="modulepreload" href="js/achievements.js">
    <link rel="modulepreload" href="js/app.js">
    <link rel="modulepreload" href="js/auth.js">
    <link rel="modulepreload" href="js/cache.js">
    <link rel="modulepreload" href="js/config.js">
    <link rel="modulepreload" href="js/data.js">
    <link rel="modulepreload" href="js/db.js">
    <link rel="modulepreload" href="js/dom.js">
    <link rel="modulepreload" href="js/lists.js">
    <link rel="modulepreload" href="js/prefs.js">
    <link rel="modulepreload" href="js/pwa.js">
    <link rel="modulepreload" href="js/ratings.js">
    <link rel="modulepreload" href="js/router.js">
    <link rel="modulepreload" href="js/social.js">
    <link rel="modulepreload" href="js/supabase.js">
    <link rel="modulepreload" href="js/texts.js">
    <link rel="modulepreload" href="js/theme.js">
    <link rel="modulepreload" href="js/today.js">
    <link rel="modulepreload" href="js/views/coming-soon.js">
    <link rel="modulepreload" href="js/views/film-controls.js">
    <link rel="modulepreload" href="js/views/list-button.js">
    <link rel="modulepreload" href="js/views/list-card.js">
    <link rel="modulepreload" href="js/views/not-found.js">
    <link rel="modulepreload" href="js/views/rating.js">
    <link rel="modulepreload" href="js/views/today.js">
    <link rel="modulepreload" href="js/views/universe.js">
    <link rel="modulepreload" href="js/views/universes.js">
    <script type="module" src="js/app.js"></script>
</head>
<body>
    <header id="site-header" class="header"></header>

    <main id="app" class="main">
        <div class="state"><div class="spinner" aria-hidden="true"></div></div>
    </main>

    <footer class="footer">
        <nav class="footer__links" aria-label="About My Movie Diary">
            <a href="#/about">About</a>
            <a href="terms.html">Terms</a>
            <a href="privacy.html">Privacy</a>
            <a href="mailto:mymoviediary.support@gmail.com">Contact</a>
            <a href="https://github.com/Kopejdos/my-movie-diary" target="_blank" rel="noopener">GitHub</a>
        </nav>
        <p class="footer__version" id="app-version"></p>
        <a href="https://www.themoviedb.org" target="_blank" rel="noopener">
            <img class="footer__tmdb" width="56" height="14"
                 src="https://www.themoviedb.org/assets/2/v4/logos/v2/blue_short-8e7b30f73a4020692ccca9c88bafe5dcb6f8a62a4c6bc55cd9ba82bb2cd95f6c.svg"
                 alt="TMDB">
        </a>
        <p>This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
    </footer>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <noscript>My Movie Diary needs JavaScript to run.</noscript>
</body>
</html>
